version: "3.8"

services:

  postgres:
    image: "postgres:latest"
    container_name: ms_order
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ms_orders_postgres:/var/lib/postgresql/data

volumes:
  ms_orders_postgres: